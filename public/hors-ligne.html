<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1746a2">
<title>Hors connexion · Examplay</title>
<style>
  :root { --brand:#1746a2; --soft:#eef3fc; --ink:#0b2559; --ok:#12784a; --ok-soft:#e9f6ef; --ko:#b3261e; --ko-soft:#fcedec; --sun:#ffc93c; --sun-dark:#d9a100; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.45; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 20px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: rgba(11,37,89,.8); }
  .card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 0 0 1px rgba(11,37,89,.1); margin-bottom: 12px; }
  button, a.btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 12px 16px; border: 0; border-radius: 14px; font: inherit; font-weight: 700; text-align: left; text-decoration: none; cursor: pointer; background: #fff; color: var(--ink); box-shadow: 0 0 0 1px rgba(11,37,89,.15); margin-bottom: 8px; }
  button.primary, a.primary { background: var(--sun); box-shadow: 0 4px 0 0 var(--sun-dark); justify-content: center; }
  button.right { background: var(--ok-soft); box-shadow: 0 0 0 2px var(--ok); }
  button.wrong { background: var(--ko-soft); box-shadow: 0 0 0 2px var(--ko); }
  button:disabled { cursor: default; }
  .count { font-weight: 600; font-size: .85rem; color: rgba(11,37,89,.6); }
  .score { font-size: 4rem; font-weight: 800; color: var(--brand); line-height: 1; margin: 12px 0; text-align: center; }
  .note { font-size: .9rem; border-radius: 12px; padding: 10px 14px; background: #fff; box-shadow: 0 0 0 1px rgba(11,37,89,.1); }
  .bar { height: 8px; border-radius: 99px; background: rgba(11,37,89,.1); overflow: hidden; margin-bottom: 16px; }
  .bar > i { display: block; height: 100%; background: var(--brand); }
</style>
</head>
<body>
<main>
  <h1>Tu es hors connexion</h1>
  <p>Tu peux quand même réviser avec les questions déjà téléchargées sur ton téléphone.</p>
  <div id="app"></div>
  <a class="btn primary" href="/dashboard" style="margin-top:16px">Réessayer la connexion</a>
</main>
<script>
(function () {
  var app = document.getElementById("app");
  var BANK = "ex:bank:", QUEUE = "ex:queue", UID = "ex:uid";

  function get(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
  }
  function set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }
  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === "text") node.textContent = props[k];
      else if (k === "class") node.className = props[k];
      else node[k] = props[k];
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }
  function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16);
    });
  }

  function banks() {
    var list = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var key = localStorage.key(i);
        if (key.indexOf(BANK) !== 0) continue;
        var b = get(key, null);
        if (b && b.questions && b.questions.length) {
          list.push({ subject: key.slice(BANK.length), name: b.name, level: b.level, questions: b.questions });
        }
      }
    } catch (e) {}
    return list.sort(function (a, b) { return a.name.localeCompare(b.name, "fr"); });
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function home() {
    clear();
    var list = banks();
    if (!list.length) {
      app.appendChild(el("div", { class: "card" }, [
        el("p", { text: "Aucune question n'est encore téléchargée. Connecte-toi une fois au tableau de bord : les questions se téléchargent toutes seules pour la prochaine fois." })
      ]));
      return;
    }
    app.appendChild(el("p", { text: "Choisis une matière (5 questions) :" }));
    list.forEach(function (b) {
      var btn = el("button", {}, [
        el("span", { text: b.name }),
        el("span", { class: "count", text: b.questions.length + " questions" })
      ]);
      btn.onclick = function () { play(b); };
      app.appendChild(btn);
    });
  }

  function play(bank) {
    var questions = shuffle(bank.questions).slice(0, 5);
    var started = Date.now(), idx = 0, answers = [];

    function show() {
      clear();
      var q = questions[idx];
      var bar = el("i");
      bar.style.width = Math.round(idx / questions.length * 100) + "%";
      app.appendChild(el("div", { class: "bar" }, [bar]));
      app.appendChild(el("div", { class: "card" }, [
        el("p", { class: "count", text: bank.name + " · Question " + (idx + 1) + "/" + questions.length }),
        el("p", { text: q.q })
      ]));
      var buttons = [];
      var explain = el("p", { class: "note" });
      explain.style.display = "none";
      var next = el("button", { class: "primary", text: idx + 1 >= questions.length ? "Terminer" : "Suivante" });
      next.style.display = "none";
      q.choices.forEach(function (c, i) {
        var b = el("button", { text: String.fromCharCode(65 + i) + ". " + c });
        b.onclick = function () {
          buttons.forEach(function (x, xi) {
            x.disabled = true;
            if (xi === q.answer) x.className = "right";
            else if (xi === i) x.className = "wrong";
          });
          answers.push({
            q: q.q, type: "qcm", choices: q.choices, given: i, givenText: "",
            correct: q.answer, correctText: q.answerText || "", explain: q.explain || "", isCorrect: i === q.answer
          });
          if (q.explain) { explain.textContent = q.explain; explain.style.display = "block"; }
          next.style.display = "flex";
        };
        buttons.push(b);
        app.appendChild(b);
      });
      app.appendChild(explain);
      next.onclick = function () { idx++; if (idx >= questions.length) finish(); else show(); };
      app.appendChild(next);
    }

    function finish() {
      clear();
      var correct = answers.filter(function (a) { return a.isCorrect; }).length;
      var pct = Math.round(correct / answers.length * 100);
      app.appendChild(el("div", { class: "score", text: pct + "%" }));
      app.appendChild(el("p", { text: correct + " / " + answers.length + " bonnes réponses" }));

      var uid = get(UID, null);
      var saved = false;
      if (uid) {
        var id = uuid();
        var queue = get(QUEUE, []);
        queue.push({
          id: id, userId: uid,
          result: { id: id, level: bank.level, subject_id: bank.subject, subject_name: bank.name, mode: "quiz", correct: correct, total: answers.length, answers: answers, duration_sec: Math.round((Date.now() - started) / 1000) },
          attempts: questions.map(function (q, i) { return { subject_id: bank.subject, skill: "concepts", correct: answers[i].isCorrect, chapter: q.chapterTitle || null, subject_name: bank.name }; })
        });
        saved = set(QUEUE, queue);
      }
      app.appendChild(el("p", { class: "note", text: saved
        ? "Ton résultat est gardé sur ton téléphone et sera envoyé dès que tu seras en ligne."
        : "Ce résultat ne pourra pas être enregistré : ouvre Examplay une fois avec une connexion." }));
      var again = el("button", { class: "primary", text: "Rejouer" });
      again.onclick = function () { play(bank); };
      var back = el("button", { text: "Autres matières" });
      back.onclick = home;
      app.appendChild(again);
      app.appendChild(back);
    }
    show();
  }

  window.addEventListener("online", function () { location.href = "/dashboard"; });
  home();
})();
</script>
</body>
</html>
